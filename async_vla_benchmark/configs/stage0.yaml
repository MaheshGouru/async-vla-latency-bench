# Stage 0 — ID-only latency calibration (docs/STAGE_0_LATENCY_CALIBRATION.md).
#
# Standard LIBERO only. LIBERO-Plus must not be installed in the image that runs
# this config: the two forks both claim the top-level `libero` package (K007).
repository: huggingface/lerobot
repository_revision: null
policy_checkpoint: lerobot/pi05_libero_finetuned
checkpoint_revision: "8e174154ef5f6c60a8da12ae99c303d8963138c1"  # main as of 2026-08-06; weights unchanged since 2025-10-01 upload
dataset_repo: HuggingFaceVLA/libero
dataset_revision: null
device: cuda
mujoco_backend: egl
policy_n_action_steps: 25  # D002 as amended 2026-08-11; asserted at preflight
control_mode: relative
eval_batch_size: 1
max_parallel_tasks: 1

# Separate from the Days 1-3 tree so calibration episodes can never overwrite
# earlier core/horizon runs -- both key raw artifacts by episode_id alone.
output_dir: async_vla_benchmark/outputs/stage0
selected_tasks_file: async_vla_benchmark/outputs/stage0/summaries/selected_tasks.json

# Seeds 0 and 1 stay the pair Stage 1 reuses as its 24 ID controls (STAGE_0
# section 5). The extras skip 2-9, which STAGE_2 section 4 reserves as held-out
# confirmatory seeds. Six rather than two because viability is a `>= 1/2` test:
# at two seeds it turns on a single episode. See benchmark/stage0.py SEEDS.
seeds: [0, 1, 10, 11, 12, 13]

obs_type: pixels_agent_pos
camera_name: "agentview_image,robot0_eye_in_hand_image"
observation_width: 224
observation_height: 224
init_states: true
num_steps_wait: 10

# The three base tasks Stage 1 perturbs (D004). task_ids are the exact zero-based
# indices asserted in benchmark/stage0.py; run_stage0.py verifies the resolved
# task *name* before running anything.
task_candidates:
  spatial: {suite: libero_spatial, task_ids: [2]}
  goal: {suite: libero_goal, task_ids: [0]}
  long: {suite: libero_10, task_ids: [2]}

# Five added-delay settings (D007, amended 2026-08-11). `native` is
# added_latency_ms=0 and still carries real measured inference latency -- it is
# not the "ideal" profile, which would zero out total latency and is absent here.
#
# Capped at 400 ms rather than 700: RTC discards the leading delay_steps actions
# of each chunk, so beyond ~500 ms of added delay its queue starves at any
# horizon and the extra levels only re-measure starvation. See
# benchmark/stage0.py ADDED_DELAYS_MS.
latency_profiles:
  native: {use_measured_native_latency: true, added_latency_ms: 0}
  native_plus_100: {use_measured_native_latency: true, added_latency_ms: 100}
  native_plus_200: {use_measured_native_latency: true, added_latency_ms: 200}
  native_plus_300: {use_measured_native_latency: true, added_latency_ms: 300}
  native_plus_400: {use_measured_native_latency: true, added_latency_ms: 400}

# No horizon sweep in Stage 0; every episode runs at n_action_steps=25.
execution_horizons: [25]

rtc:
  enabled: true
  max_guidance_weight: 10.0
  prefix_attention_schedule: EXP
  # execution_horizon / request_threshold_actions are derived per episode from
  # FIXED_HORIZON=25, giving 25 and 25 -- identical for the paired naive_async
  # and RTC runs, which is what makes the method comparison fair (K009).
  #
  # The threshold is 25, not the spec section 16 default of ceil(H/2): requesting
  # only once the queue has half drained spends half the latency budget before
  # the request goes out, which is what left the H=10 run underrunning ~33% of
  # its steps at zero added delay. See benchmark/stage0.py
  # REQUEST_THRESHOLD_ACTIONS. Days 1-3 keeps the section 16 default.
