repository: huggingface/lerobot
repository_revision: "2aba372b4e217cc47db28e0f836859b20d1456c9"
policy_checkpoint: lerobot/pi05_libero_finetuned
checkpoint_revision: "8e174154ef5f6c60a8da12ae99c303d8963138c1"
dataset_repo: HuggingFaceVLA/libero
dataset_revision: null
device: cuda
mujoco_backend: egl
policy_n_action_steps: 10
control_mode: relative
eval_batch_size: 1
max_parallel_tasks: 1
output_dir: async_vla_benchmark/outputs/stage0
seeds: [0, 1]
obs_type: pixels_agent_pos
camera_name: "agentview_image,robot0_eye_in_hand_image"
observation_width: 224
observation_height: 224
init_states: true
num_steps_wait: 10

latency_profiles:
  native: {use_measured_native_latency: true, added_latency_ms: 0}
  native_plus_100: {use_measured_native_latency: true, added_latency_ms: 100}
  native_plus_200: {use_measured_native_latency: true, added_latency_ms: 200}
  native_plus_300: {use_measured_native_latency: true, added_latency_ms: 300}
  native_plus_400: {use_measured_native_latency: true, added_latency_ms: 400}
  native_plus_500: {use_measured_native_latency: true, added_latency_ms: 500}
  native_plus_600: {use_measured_native_latency: true, added_latency_ms: 600}
  native_plus_700: {use_measured_native_latency: true, added_latency_ms: 700}

execution_horizons: [10]
rtc:
  enabled: true
  max_guidance_weight: 10.0
  prefix_attention_schedule: EXP

stage0:
  methods: [naive_async, rtc]
  added_delays_ms: [0, 100, 200, 300, 400, 500, 600, 700]
  seeds: [0, 1]
  fixed_horizon: 10
  tasks:
    - task_key: single_stage_transport
      task_group_key: single_stage_transport
      task_group_label: Single-stage transport
      suite: libero_spatial
      task_id: 2
      task_name: pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate
    - task_key: articulated_contact_rich
      task_group_key: articulated_contact_rich
      task_group_label: Articulated/contact-rich
      suite: libero_goal
      task_id: 0
      task_name: open_the_middle_drawer_of_the_cabinet
    - task_key: multi_stage_sequential
      task_group_key: multi_stage_sequential
      task_group_label: Multi-stage/sequential
      suite: libero_10
      task_id: 2
      task_name: KITCHEN_SCENE3_turn_on_the_stove_and_put_the_moka_pot_on_it
